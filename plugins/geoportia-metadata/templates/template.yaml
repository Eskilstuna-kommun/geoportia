apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: geoportia-metadata-template
  title: Main dataset template
  description: En mall för att samla in och hantera metadata för en huvuddatamängd
spec:
  owner: user:guest
  type: service

  parameters:
    # ============================================================
    # 1. Allmän information
    # ============================================================
    - title: Allmän information
      required:
        - generalInfo
      properties:
        generalInfo:
          title: Allmän information
          type: object
          ui:field: GeoPortiaMetadataField
          ui:options:
            headerTitle: Allmän information
            showSidebar: true
            geoportiaMetadataSchema:
              required:
                - title
                - summary
                - subjectArea
                - geographicExtent
                - metadataStatus
              properties:
                title:
                  type: string
                  title: Titel
                summary:
                  type: string
                  title: Sammanfattning
                subjectArea:
                  type: array
                  title: Ämnesområde
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - 'Administrativa gränser - offentligt bestämda avgränsningar av ett område'
                      - 'Arealtäckande bilder och baskartor - arealtäckande bilder och topografiska kartor'
                      - 'Areella näringar - skötsel av djur eller odling av grödor'
                      - 'Atmosfär, klimatologi och meteorologi - processer och fenomen i atmosfären'
                      - 'Biologi och ekologi - flora och fauna i naturlig miljö'
                      - 'Byggnader och byggnadskonstruktioner - konstruktioner skapade av människohand'
                      - 'Ekonomi - ekonomiska aktiviteter, förhållanden och sysselsättning'
                      - 'Fastigheter och fysisk planering - fastighetsinformation och planinformation för framtida markanvändning'
                      - 'Försvar - militär infrastruktur och aktiviteter'
                      - 'Geovetenskap - geovetenskap'
                      - 'Hälsa hälsa, sjuk- och hälsovård - human ekologi och säkerhet'
                      - 'Höjddata - höjd över eller under havsytan'
                      - 'Kust och hav - havs- och kustområden och dess egenskaper'
                      - 'Miljö - miljöresurser, miljöskydd och bevarande'
                      - 'Positionering - positionsbestämmande information och tjänster'
                      - 'Samhälle och kultur - samhällsförhållanden och kultur'
                      - 'Sjöar och vattendrag - insjövatten, dräneringssystem och deras egenskaper'
                      - 'Tekniska försörjningssystem - energi-, vatten- och avloppssystem, och infrastruktur och tjänster för kommunikation'
                      - 'Transporter - infrastruktur och hjälpmedel för att transportera människor och gods'
                  default: []
                geographicExtent:
                  type: string
                  title: Geografisk utbredning
                  enum:
                    - 'Välj...'
                    - 'Inte applicerbart'
                    - 'Ej definierad'
                    - 'Minimal'
                    - 'Mälardalen'
                    - 'Södermanland'
                    - 'Sverige'
                    - 'Eskilstuna'
                    - '4M'
                  default: 'Välj...'
                metadataStatus:
                  type: string
                  title: Status metadata
                  enum:
                    - 'Välj...'
                    - 'Ska sättas'
                    - 'Raderad'
                    - 'Förslagen'
                    - 'Godkänd'
                    - 'Ska avpubliceras'
                  default: 'Välj...'
            geoportiaMetadataUiSchema:
              summary:
                'ui:widget': 'textarea'
                'ui:options':
                  rows: 4
              subjectArea:
                'ui:widget': MultiSelectWidget

    # ============================================================
    # 2. Datakälla — Fil
    # ============================================================
    - title: Datakälla — Fil
      properties:
        dataSourceFile:
          title: Datakälla — Fil
          type: object
          ui:field: GeoPortiaMetadataField
          ui:options:
            headerTitle: Datakälla — Fil
            showSidebar: true
            geoportiaMetadataSchema:
              properties:
                catalogPath:
                  type: string
                  title: Sökväg för katalog
                  description: Sökväg till katalogen som innehåller fil/filer.
                fileName:
                  type: string
                  title: Filnamn
                  description: Kan innehålla wildcard (t.ex. * för tilad bild).
                fileType:
                  type: string
                  title: Filtyp (Raster / Filbaserad databas / Fil)
                  enum:
                    - 'Välj...'
                    - 'Raster'
                    - 'Filbaserad databas'
                    - 'Fil'
                  default: 'Välj...'

                # --- a. Raster (visas när fileType = Raster) ---
                raster:
                  type: object
                  title: Raster
                  properties:
                    rasterFileFormat:
                      type: string
                      title: Rasterfilformat
                      enum:
                        - 'Välj...'
                        - 'GeoTIFF'
                        - 'ECW'
                        - 'JPEG2000'
                        - 'IMG (ERDAS)'
                        - 'PNG'
                        - 'JPG'
                        - 'MrSID'
                        - 'Annat'
                      default: 'Välj...'
                    resolution:
                      type: string
                      title: Upplösning
                    bands:
                      type: string
                      title: Band
                      description: Specifikation av band (väntar på förtydligande av datamodell).
                    nullValue:
                      type: string
                      title: Null-värde
                      description: Den siffra som motsvarar null.
                    temporalResolution:
                      type: string
                      title: Temporal upplösning

                # --- b. Filbaserad databas (visas när fileType = Filbaserad databas) ---
                fileBasedDatabase:
                  type: object
                  title: Filbaserad databas
                  properties:
                    uniqueIdentifier:
                      type: string
                      title: Unik identifierare för huvuddatamängden
                    geometryType:
                      type: string
                      title: Geometrityp
                      enum:
                        - 'Välj...'
                        - 'Linje'
                        - 'Yta'
                        - 'Punkt'
                        - 'Ingen geometri'
                      default: 'Välj...'

                # --- c. Fil (visas när fileType = Fil) ---
                file:
                  type: object
                  title: Fil
                  properties:
                    # NOTE: vallista för Format behöver fastställas av kunden.
                    format:
                      type: string
                      title: Format
                      enum:
                        - 'Välj...'
                        - 'SHP'
                        - 'GeoJSON'
                        - 'KML'
                        - 'GML'
                        - 'CSV'
                        - 'TAB'
                        - 'Annat'
                      default: 'Välj...'
                    geometryType:
                      type: string
                      title: Geometrityp
                      enum:
                        - 'Välj...'
                        - 'Linje'
                        - 'Yta'
                        - 'Punkt'
                        - 'Ingen geometri'
                      default: 'Välj...'

                # Spatialt referenssystem (plan och höjd) - SKA INTE VISAS NÄR INGEN GEOMETRI ÄR VALD
                spatialReferenceSystem:
                  type: object
                  title: Spatialt referenssystem (plan och höjd)
                  properties:
                    horizontal:
                      type: string
                      title: Plan
                      description: Lagras som EPSG-kod.
                      enum:
                        - ''
                        - 'EPSG:3006'
                        - 'EPSG:4326'
                        - 'EPSG:3010'
                      enumNames:
                        - 'Välj...'
                        - 'SWEREF99 TM (EPSG:3006)'
                        - 'WGS 84 (EPSG:4326)'
                        - 'SWEREF99 16 30 (EPSG:3010)'
                      default: ''
                    vertical:
                      type: string
                      title: Höjd
                      description: Lagras som EPSG-kod.
                      enum:
                        - ''
                        - 'EPSG:5613'
                        - 'EPSG:5701'
                      enumNames:
                        - 'Välj...'
                        - 'RH 2000 (EPSG:5613)'
                        - 'RH 70 (EPSG:5701)'
                      default: ''
            geoportiaMetadataUiSchema: {}

    # ============================================================
    # 3. Datakälla — DB
    # ============================================================
    - title: Datakälla — DB
      properties:
        dataSourceDb:
          title: Datakälla — DB
          type: object
          ui:field: GeoPortiaMetadataField
          ui:options:
            headerTitle: Datakälla — DB
            showSidebar: true
            geoportiaMetadataSchema:
              properties:
                database:
                  type: string
                  title: Databas
                databaseOwner:
                  type: string
                  title: Databasanvändare (dataägare)
                dataType:
                  type: string
                  title: Datatyp (Raster / Vektor / Tabell)
                  enum:
                    - 'Välj...'
                    - 'Raster'
                    - 'Vektor'
                    - 'Tabell'
                  default: 'Välj...'

                # --- a. Raster (visas när dataType = Raster) ---
                raster:
                  type: object
                  title: Raster
                  properties:
                    resolution:
                      type: string
                      title: Upplösning
                    bands:
                      type: string
                      title: Band
                      description: Specifikation av band (väntar på förtydligande av datamodell).
                    nullValue:
                      type: string
                      title: Null-värde
                    temporalResolution:
                      type: string
                      title: Temporal upplösning
                    spatialReferenceSystem:
                      type: object
                      title: Spatialt referenssystem (plan och höjd)
                      properties:
                        horizontal:
                          type: string
                          title: Plan
                          enum:
                            - ''
                            - 'EPSG:3006'
                            - 'EPSG:4326'
                            - 'EPSG:3010'
                          enumNames:
                            - 'Välj...'
                            - 'SWEREF99 TM (EPSG:3006)'
                            - 'WGS 84 (EPSG:4326)'
                            - 'SWEREF99 16 30 (EPSG:3010)'
                          default: ''
                        vertical:
                          type: string
                          title: Höjd
                          enum:
                            - ''
                            - 'EPSG:5613'
                            - 'EPSG:5701'
                          enumNames:
                            - 'Välj...'
                            - 'RH 2000 (EPSG:5613)'
                            - 'RH 70 (EPSG:5701)'
                          default: ''

                # --- b. Vektor (visas när dataType = Vektor) ---
                vector:
                  type: object
                  title: Vektor
                  properties:
                    geometryType:
                      type: string
                      title: Geometrityp
                      description: ESRI-/PostGIS-specifika alternativ.
                      enum:
                        - 'Välj...'
                        - 'Punkt'
                        - 'Linje'
                        - 'Yta'
                        - 'Multipoint'
                        - 'Multilinje'
                        - 'Multipolygon'
                        - 'Ingen geometri'
                      default: 'Välj...'
                    allowAttachments:
                      type: boolean
                      title: Tillåt bilagor
                      description: ESRI-specifikt.
                      default: false
                    spatialReferenceSystem:
                      type: object
                      title: Spatialt referenssystem (plan och höjd)
                      description: Styr filtrering av datasetslistan och skapande av nytt dataset.
                      properties:
                        horizontal:
                          type: string
                          title: Plan
                          enum:
                            - ''
                            - 'EPSG:3006'
                            - 'EPSG:4326'
                            - 'EPSG:3010'
                          enumNames:
                            - 'Välj...'
                            - 'SWEREF99 TM (EPSG:3006)'
                            - 'WGS 84 (EPSG:4326)'
                            - 'SWEREF99 16 30 (EPSG:3010)'
                          default: ''
                        vertical:
                          type: string
                          title: Höjd
                          enum:
                            - ''
                            - 'EPSG:5613'
                            - 'EPSG:5701'
                          enumNames:
                            - 'Välj...'
                            - 'RH 2000 (EPSG:5613)'
                            - 'RH 70 (EPSG:5701)'
                          default: ''
                    # Dataset (ESRI-specifikt) - välj eller skapa nytt
                    dataset:
                      type: string
                      title: Dataset
                      description: Välj befintligt eller skapa nytt (ESRI-specifikt).
                    # Attributspecifikation - knappar (Skapa i databas / Hämta /
                    # Översikt) implementeras i widgeten.
                    attributes:
                      type: array
                      title: Attributspecifikation
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            title: Namn
                          alias:
                            type: string
                            title: Alias (FTL-namn)
                          description:
                            type: string
                            title: Beskrivning
                          dataFormat:
                            type: string
                            title: Dataformat
                          length:
                            type: string
                            title: Längd
                          securityClass:
                            type: string
                            title: Skyddsklass
                            enum:
                              - 'Välj...'
                              - 'Inget skyddsbehov'
                              - 'Begränsat skyddsbehov'
                              - 'Måttligt skyddsbehov'
                              - 'Högt skyddsbehov'
                              - 'Mycket högt skyddsbehov'
                            default: 'Välj...'
                          domain:
                            type: string
                            title: Domän
                          allowEmptyValues:
                            type: boolean
                            title: Tillåt tomma värden
                            default: false

                # --- c. Tabell (visas när dataType = Tabell) ---
                table:
                  type: object
                  title: Tabell
                  properties:
                    tableEntity:
                      type: string
                      title: Tabell
                      description: Välj från befintliga Table-entiteter som refererar vald databas.
                    # Attributspecifikation - knappar (Skapa databas / Hämta /
                    # Översikt) implementeras i widgeten.
                    attributes:
                      type: array
                      title: Attributspecifikation
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            title: Namn
                          alias:
                            type: string
                            title: Alias (FTL-namn)
                          description:
                            type: string
                            title: Beskrivning
                          dataFormat:
                            type: string
                            title: Dataformat
                          length:
                            type: string
                            title: Längd
                          securityClass:
                            type: string
                            title: Skyddsklass
                            enum:
                              - 'Välj...'
                              - 'Inget skyddsbehov'
                              - 'Begränsat skyddsbehov'
                              - 'Måttligt skyddsbehov'
                              - 'Högt skyddsbehov'
                              - 'Mycket högt skyddsbehov'
                            default: 'Välj...'
                          domain:
                            type: string
                            title: Domän
                          allowEmptyValues:
                            type: boolean
                            title: Tillåt tomma värden
                            default: false

                # Datamängdsnamn - databas, användare, dataset är redan kända
                datasetName:
                  type: string
                  title: Datamängdsnamn
            geoportiaMetadataUiSchema:
              database:
                'ui:widget': DatabaseSelectWidget
              databaseOwner:
                'ui:widget': UserSearchWidget
              vector:
                dataset:
                  'ui:widget': DatasetSelectWidget
                attributes:
                  'ui:options':
                    addButtonText: Skapa nytt attribut
                    emptyMessage: Inga attribut än. Klicka på knappen ovan för att lägga till ett.
                    tableColumns:
                      - name
                      - alias
                      - securityClass
                      - description
                      - domain
                  items:
                    description:
                      'ui:widget': 'textarea'
                      'ui:options':
                        rows: 3
              table:
                tableEntity:
                  'ui:widget': TableSelectWidget
                attributes:
                  'ui:options':
                    addButtonText: Skapa nytt attribut
                    emptyMessage: Inga attribut än. Klicka på knappen ovan för att lägga till ett.
                    tableColumns:
                      - name
                      - alias
                      - securityClass
                      - description
                      - domain
                  items:
                    description:
                      'ui:widget': 'textarea'
                      'ui:options':
                        rows: 3

    # ============================================================
    # 4. Ägarskap och förvaltning
    # ============================================================
    - title: Ägarskap och förvaltning
      required:
        - ownership
      properties:
        ownership:
          title: Ägarskap och förvaltning
          type: object
          ui:field: GeoPortiaMetadataField
          ui:options:
            headerTitle: Ägarskap och förvaltning
            showSidebar: true
            geoportiaMetadataSchema:
              required:
                - owner
                - administrationRoutine
                - maintenanceFrequency
                - archiveOption
              properties:
                owner:
                  type: string
                  title: Ägare
                administrationRoutine:
                  type: string
                  title: Administrationsrutin
                  enum:
                    - 'Välj...'
                    - 'Informationsägaren gör jobbet själv'
                    - 'Informationsägaren får stöd av kontaktperson på Projekt- och GIS-avdelningen som står för teknisk kvalitetssäkring'
                    - 'Informationsägaren ger hela uppdraget till Projekt- och GIS-avdelningen'
                    - 'Information om förvaltningsprocessen saknas'
                  default: 'Välj...'
                maintenanceFrequency:
                  type: string
                  title: Underhållsfrekvens
                  enum:
                    - 'Välj...'
                    - 'Okänt - uppdateringsfrekvens är ej känd'
                    - 'Kontinuerlig - data uppdateras ofta och kontinuerligt'
                    - 'Dagligen - data uppdateras dagligen'
                    - 'Veckovis - data uppdateras veckovis'
                    - 'Var 14:e dag - data uppdateras varannan vecka'
                    - 'Månadsvis - data uppdateras varje månad'
                    - 'Kvartalsvis - data uppdateras kvartalsvis'
                    - 'Halvårsvis - data uppdateras halvårsvis'
                    - 'Årligen - data uppdateras årligen'
                    - 'Vid behov - data uppdateras vid behov'
                    - 'Oregelbundet - data uppdateras med oregelbundna intervall'
                    - 'Ej planerad - data uppdateras planerad uppdatering'
                  default: 'Välj...'
                archiveOption:
                  type: string
                  title: Arkiveringsalternativ av datamängd
                  enum:
                    - 'Välj...'
                    - 'Ingen arkivering'
                    - 'Arkiveras enligt arkivplan'
                    - 'Arkiveras vid avveckling'
                    - 'Annan rutin'
                  default: 'Välj...'
                datasetStatus:
                  type: string
                  title: Status datamängd
                  enum:
                    - 'Välj...'
                    - 'Komplett. Uppdateras eller kompletteras inte längre.'
                    - 'Planerad men ej tillgänglig för närvarande.'
                    - 'Under utveckling men ej normal tillgänglig.'
                    - 'Uppdateras eller kompletteras kontinuerligt.'
                  default: 'Välj...'
                managementAgreementDate:
                  type: string
                  title: Datum för förvaltningsöverenskommelse
                  description: 'Format: ÅÅÅÅ-MM-DD'
                metadataContact:
                  type: string
                  title: Metadatakontakt
                mainDatasetContact:
                  type: string
                  title: Huvuddatamängdkontakt
            geoportiaMetadataUiSchema:
              owner:
                'ui:widget': GroupSearchWidget
              metadataContact:
                'ui:widget': UserSearchWidget
              mainDatasetContact:
                'ui:widget': UserSearchWidget

    # ============================================================
    # 5. Tillkomsthistorik
    # ============================================================
    - title: Tillkomsthistorik
      required:
        - history
      properties:
        history:
          title: Tillkomsthistorik
          type: object
          ui:field: GeoPortiaMetadataField
          ui:options:
            headerTitle: Tillkomsthistorik
            showSidebar: true
            geoportiaMetadataSchema:
              properties:
                source:
                  type: string
                  title: Källa
                  enum:
                    - 'Välj...'
                    - 'Egen datafångst'
                    - 'Lantmäteriet'
                    - 'Trafikverket'
                    - 'SCB'
                    - 'Annan myndighet'
                    - 'Privat aktör'
                    - 'Annat'
                  default: 'Välj...'
                sourceText:
                  type: string
                  title: Källa (fritext)
                quality:
                  type: string
                  title: Kvalitet
                  enum:
                    - 'Välj...'
                    - 'Hög'
                    - 'Medel'
                    - 'Låg'
                    - 'Ej bedömd'
                    - 'Annat'
                  default: 'Välj...'
                qualityText:
                  type: string
                  title: Kvalitet (fritext)
                dataCollectionMethod:
                  type: string
                  title: Datainsamlingsmetod
                  enum:
                    - 'Välj...'
                    - 'Manuell digitalisering'
                    - 'Fältmätning'
                    - 'Fjärranalys'
                    - 'Skanning'
                    - 'Import från annan källa'
                    - 'Beräknad / härledd'
                    - 'Annat'
                  default: 'Välj...'
                processingSteps:
                  type: string
                  title: Bearbetningssteg
                  enum:
                    - 'Välj...'
                    - 'Ingen bearbetning'
                    - 'Filtrering / urval'
                    - 'Sammanslagning / aggregering'
                    - 'Topologisk rensning'
                    - 'Generalisering'
                    - 'Konvertering mellan format'
                    - 'Beräkning av nya attribut'
                    - 'Annat'
                  default: 'Välj...'
                processingStepsText:
                  type: string
                  title: Bearbetningssteg (fritext)
            geoportiaMetadataUiSchema:
              sourceText:
                'ui:widget': 'textarea'
                'ui:options':
                  rows: 2
              qualityText:
                'ui:widget': 'textarea'
                'ui:options':
                  rows: 2
              processingStepsText:
                'ui:widget': 'textarea'
                'ui:options':
                  rows: 4

    # ============================================================
    # 6. Säkerhet och åtkomst (inkluderar Restriktioner + Behörigheter)
    # ============================================================
    - title: Säkerhet och åtkomst
      required:
        - security
      properties:
        security:
          title: Säkerhet och åtkomst
          type: object
          ui:field: GeoPortiaMetadataField
          ui:options:
            headerTitle: Säkerhet och åtkomst
            showSidebar: true
            geoportiaMetadataSchema:
              required:
                - securityClass
              properties:
                securityClass:
                  type: string
                  title: Skyddsklass
                  description: Påverkar öppna-data-valet för kartlagerspec/distribution.
                  enum:
                    - 'Välj...'
                    - 'Inget skyddsbehov - tillgänglig för allmän åtkomst Anm: Ingen eller försumbar skada uppstår vid allmän tillgång till resursen.'
                    - 'Begränsat skyddsbehov - tillgänglig för behörig Anm: Ringa skada uppstår vid obehörig tillgång till resursen.'
                    - 'Måttligt skyddsbehov - tillgänglig för behörig Anm: Icke obetydlig skada uppstår vid obehörig tillgång till resursen.'
                    - 'Högt skyddsbehov - tillgänglig för behörig Anm: Betydande skada uppstår vid obehörig tillgång till resursen.'
                    - 'Mycket högt skyddsbehov - tillgänglig för behörig Anm: Allvarlig skada uppstår vid obehörig tillgång'
                  default: 'Välj...'
                personalData:
                  type: boolean
                  title: Personuppgifter
                  default: false
                legalBasis:
                  type: string
                  title: Lagrum

                # --- 4. Restriktioner och behörigheter ---
                restrictionsAndPermissions:
                  type: object
                  title: Restriktioner och behörigheter
                  properties:
                    # a. Restriktioner
                    restrictions:
                      type: object
                      title: Restriktioner
                      required:
                        - accessRestrictions
                        - usageRestrictions
                      properties:
                        accessRestrictions:
                          type: string
                          title: Åtkomstrestriktioner
                          enum:
                            - 'Välj...'
                            - 'Inga restriktioner'
                            - 'Endast för behörig personal'
                            - 'Endast för intern användning'
                            - 'Sekretessbelagd enligt lag'
                          default: 'Välj...'
                        usageRestrictions:
                          type: string
                          title: Restriktioner för användande
                          enum:
                            - 'Välj...'
                            - 'Inga restriktioner'
                            - 'Endast för internt bruk'
                            - 'Får ej spridas vidare'
                            - 'Licensierad användning'
                          default: 'Välj...'
                        otherRestrictions:
                          type: string
                          title: Övriga restriktioner

                    # b. Behörigheter
                    permissions:
                      type: object
                      title: Behörigheter
                      properties:
                        permissionGroups:
                          type: array
                          title: Behörighetsgrupper
                          items:
                            type: object
                            required:
                              - name
                              - status
                            properties:
                              name:
                                type: string
                                title: Namn
                              description:
                                type: string
                                title: Beskrivning
                              members:
                                type: array
                                title: Medlemmar (AD)
                                items:
                                  type: string
                              status:
                                type: string
                                title: Status
                                enum:
                                  - 'Välj...'
                                  - 'Aktiv'
                                  - 'Inaktiv'
                                  - 'Under granskning'
                                default: 'Välj...'
                              canRead:
                                type: boolean
                                title: Har behörighet att läsa (huvuddatamängder)
                                default: false
                              canEdit:
                                type: boolean
                                title: Har behörighet att redigera (huvuddatamängder)
                                default: false
                        readPermissionMembers:
                          type: array
                          title: Enskilda läsbehörigheter
                          items:
                            type: string
                        editPermissionMembers:
                          type: array
                          title: Enskilda redigeringsbehörigheter
                          items:
                            type: string
                        # NOTE: "Visa behörigheter att läsa/redigera" är
                        # render-only vy som ska implementeras i UI, ej i
                        # template-input.
            geoportiaMetadataUiSchema:
              legalBasis:
                'ui:widget': 'textarea'
                'ui:options':
                  rows: 3
              restrictionsAndPermissions:
                restrictions:
                  otherRestrictions:
                    'ui:widget': 'textarea'
                    'ui:options':
                      rows: 3
                permissions:
                  permissionGroups:
                    'ui:options':
                      addButtonText: Lägg till behörighetsgrupp
                      emptyMessage: Inga behörighetsgrupper än.
                      tableColumns:
                        - name
                        - status
                        - canRead
                        - canEdit
                    items:
                      members:
                        'ui:widget': UserSearchWidget
                      description:
                        'ui:widget': 'textarea'
                        'ui:options':
                          rows: 2
                  readPermissionMembers:
                    'ui:widget': UserSearchWidget
                  editPermissionMembers:
                    'ui:widget': UserSearchWidget

  steps:
    - id: log
      name: Log values
      action: debug:log
      input:
        message: 'Metadata collected'

    - id: store-metadata
      name: Store Metadata
      action: geoportia:metadata:store
      input:
        entityRef: metadataentry:default/${{ parameters.generalInfo.metadata.title | lower | replace(" ", "-") }}-metadata
        schema:
          type: object
          properties:
            generalInfo: ${{ parameters.generalInfo.schema }}
            dataSourceFile: ${{ parameters.dataSourceFile.schema }}
            dataSourceDb: ${{ parameters.dataSourceDb.schema }}
            ownership: ${{ parameters.ownership.schema }}
            history: ${{ parameters.history.schema }}
            security: ${{ parameters.security.schema }}
        metadata:
          generalInfo: ${{ parameters.generalInfo.metadata }}
          dataSourceFile: ${{ parameters.dataSourceFile.metadata }}
          dataSourceDb: ${{ parameters.dataSourceDb.metadata }}
          ownership: ${{ parameters.ownership.metadata }}
          history: ${{ parameters.history.metadata }}
          security: ${{ parameters.security.metadata }}

  output:
    links:
      - title: View Metadata Entry
        icon: catalog
        entityRef: ${{ steps['store-metadata'].output.entityRef }}
